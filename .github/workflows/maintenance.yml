name: Restricted CoreDrive maintenance
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restricted-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.repository == 'Hussanlal/coredrive-maintenance-timer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node timer.mjs
        env:
          COREDRIVE_MAINTENANCE_KEY: ${{ secrets.COREDRIVE_MAINTENANCE_KEY }}
          PURGE_SOURCE_SHA256: ${{ vars.PURGE_SOURCE_SHA256 }}
          WATCHDOG_SOURCE_SHA256: ${{ vars.WATCHDOG_SOURCE_SHA256 }}
          RUNNER_SOURCE_SHA256: ${{ vars.RUNNER_SOURCE_SHA256 }}
  readiness:
    needs: maintain
    if: always() && github.repository == 'Hussanlal/coredrive-maintenance-timer' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node timer.mjs --health
